<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Z407 Controller</title>
    <meta name="theme-color" content="#0f0f0f">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔊</text></svg>">
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --card-hover: #222;
            --border: #2a2a2a;
            --text: #e4e4e4;
            --text-dim: #888;
            --accent: #7c6cf0;
            --accent-hover: #9488f7;
            --green: #4ade80;
            --red: #f87171;
            --yellow: #fbbf24;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            max-width: 420px;
            width: 100%;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 0 16px;
        }
        .header h1 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--card);
            border: 1px solid var(--border);
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--red);
            transition: background 0.3s;
        }
        .status-dot.connected { background: var(--green); }
        .status-dot.connecting {
            background: var(--yellow);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Section Card */
        .section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            margin-bottom: 12px;
        }

        /* Volume */
        .volume-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .volume-slider-wrap {
            flex: 1;
            position: relative;
        }
        .volume-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--border);
            outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px; height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg);
            box-shadow: 0 0 6px rgba(124,108,240,0.4);
        }
        .volume-slider::-moz-range-thumb {
            width: 20px; height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg);
        }
        .volume-label {
            font-size: 0.9rem;
            font-weight: 600;
            min-width: 3ch;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.15s;
            user-select: none;
        }
        .btn:active { transform: scale(0.95); }
        .btn:hover { background: var(--card-hover); border-color: #3a3a3a; }

        .btn-icon {
            width: 48px; height: 48px;
            font-size: 1.2rem;
            padding: 0;
        }

        .btn-wide {
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 500;
            gap: 8px;
        }

        .btn-accent {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

        .btn-danger {
            color: var(--red);
            border-color: #3a2020;
        }
        .btn-danger:hover { background: #2a1515; }

        /* Playback row */
        .playback-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .playback-row .btn-icon {
            flex: 1;
            max-width: 80px;
        }
        .play-btn {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            font-size: 1.3rem;
        }
        .play-btn:hover { background: var(--accent-hover); }

        /* Bass row */
        .bass-row {
            display: flex;
            gap: 8px;
        }
        .bass-row .btn { flex: 1; height: 48px; }

        /* Input source */
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-btn {
            flex: 1;
            height: 44px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .input-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* Pair section */
        .pair-status {
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--text-dim);
            min-height: 1.2em;
        }
        .pair-status.active { color: var(--yellow); }
        .pair-status.done { color: var(--green); }

        /* Disabled state */
        .disabled {
            opacity: 0.35;
            pointer-events: none;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s;
            z-index: 100;
            pointer-events: none;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.error { background: #7f1d1d; }
    </style>
</head>
<body>
<div class="app">

    <!-- Header -->
    <div class="header">
        <h1>🔊 Z407 Controller</h1>
        <div class="status-badge">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Disconnected</span>
        </div>
    </div>

    <!-- Volume -->
    <div class="section" id="controlsContainer">
        <div class="section-title">Volume</div>
        <div class="volume-row">
            <button class="btn btn-icon" onclick="cmd('volume_down')">−</button>
            <div class="volume-slider-wrap">
                <input type="range" class="volume-slider" id="volumeSlider"
                       min="0" max="100" step="5" value="50">
            </div>
            <button class="btn btn-icon" onclick="cmd('volume_up')">+</button>
            <span class="volume-label" id="volumeLabel">50</span>
        </div>
    </div>

    <!-- Bass -->
    <div class="section">
        <div class="section-title">Bass</div>
        <div class="bass-row">
            <button class="btn" onclick="cmd('bass_down')">− Bass</button>
            <button class="btn" onclick="cmd('bass_up')">+ Bass</button>
        </div>
    </div>

    <!-- Playback -->
    <div class="section">
        <div class="section-title">Playback</div>
        <div class="playback-row">
            <button class="btn btn-icon" onclick="cmd('prev_track')">⏮</button>
            <button class="btn btn-icon play-btn" onclick="cmd('play_pause')">▶</button>
            <button class="btn btn-icon" onclick="cmd('next_track')">⏭</button>
        </div>
    </div>

    <!-- Input Source -->
    <div class="section">
        <div class="section-title">Input Source</div>
        <div class="input-row">
            <button class="btn input-btn" data-source="bluetooth"
                    onclick="switchInput('bluetooth')">Bluetooth</button>
            <button class="btn input-btn" data-source="aux"
                    onclick="switchInput('aux')">AUX</button>
            <button class="btn input-btn" data-source="usb"
                    onclick="switchInput('usb')">USB</button>
        </div>
    </div>

    <!-- Pair New Device -->
    <div class="section">
        <div class="section-title">Pair New Device</div>
        <button class="btn btn-wide btn-accent" onclick="pairDevice()">
            📡 Pair New Device
        </button>
        <div class="pair-status" id="pairStatus">
            Click to activate pairing mode (120 seconds)
        </div>
    </div>

    <!-- System -->
    <div class="section">
        <div class="section-title">System</div>
        <button class="btn btn-wide btn-danger" onclick="factoryReset()">
            ⚠️ Factory Reset
        </button>
    </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeLabel = document.getElementById('volumeLabel');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const pairStatusEl = document.getElementById('pairStatus');
    const toast = document.getElementById('toast');

    let connected = false;
    let volumeDebounce = null;
    let currentVolume = 50;

    // -- Commands --

    async function cmd(name, params = {}) {
        try {
            const res = await fetch(`/api/command/${name}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(params),
            });
            const data = await res.json();
            if (!data.success) {
                showToast(data.error || 'Command failed', true);
            }
            return data;
        } catch (e) {
            showToast('Connection lost', true);
        }
    }

    async function switchInput(source) {
        await cmd('input', { source });
        setActiveInput(source);
    }

    async function pairDevice() {
        pairStatusEl.textContent = 'Pairing mode active for 120 seconds — open Bluetooth settings on your device…';
        pairStatusEl.className = 'pair-status active';
        await cmd('pair');
        pairStatusEl.textContent = 'Done — Bluetooth input active';
        pairStatusEl.className = 'pair-status done';
        setTimeout(() => {
            pairStatusEl.textContent = 'Click to activate pairing mode (120 seconds)';
            pairStatusEl.className = 'pair-status';
        }, 10000);
    }

    function factoryReset() {
        if (confirm('Factory reset the speaker? This cannot be undone.')) {
            cmd('factory_reset');
            showToast('Factory reset sent');
        }
    }

    // -- Volume slider --

    volumeSlider.addEventListener('input', () => {
        volumeLabel.textContent = volumeSlider.value;
    });

    volumeSlider.addEventListener('change', () => {
        const target = parseInt(volumeSlider.value);
        const delta = target - currentVolume;
        const steps = Math.abs(delta) / 5;
        if (steps === 0) return;

        if (delta > 0) {
            cmd('volume_up', { steps });
        } else {
            cmd('volume_down', { steps });
        }
        currentVolume = target;
    });

    // -- State updates --

    function setActiveInput(source) {
        document.querySelectorAll('.input-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.source === source);
        });
    }

    function updateState(data) {
        if (data.state !== undefined) {
            const s = data.state;
            connected = data.connected;

            statusDot.className = 'status-dot';
            if (s === 'connected') {
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
            } else if (s === 'scanning' || s === 'connecting' || s === 'handshaking') {
                statusDot.classList.add('connecting');
                statusText.textContent = s.charAt(0).toUpperCase() + s.slice(1) + '…';
            } else {
                statusText.textContent = 'Disconnected';
            }
        }

        if (data.volume !== undefined) {
            currentVolume = data.volume;
            volumeSlider.value = data.volume;
            volumeLabel.textContent = data.volume;
        }

        if (data.input) {
            setActiveInput(data.input);
        }
    }

    // -- SSE --

    function setupSSE() {
        const es = new EventSource('/api/events');

        es.addEventListener('status', e => updateState(JSON.parse(e.data)));
        es.addEventListener('volume', e => updateState(JSON.parse(e.data)));
        es.addEventListener('input', e => updateState(JSON.parse(e.data)));

        es.onerror = () => {
            statusDot.className = 'status-dot';
            statusText.textContent = 'Server lost';
            setTimeout(() => {
                es.close();
                setupSSE();
            }, 3000);
        };
    }

    // -- Toast --

    let toastTimer;
    function showToast(msg, isError = false) {
        toast.textContent = msg;
        toast.className = 'toast show' + (isError ? ' error' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.className = 'toast'; }, 2500);
    }

    // -- Init --

    (async function init() {
        try {
            const res = await fetch('/api/status');
            updateState(await res.json());
        } catch (e) {}
        setupSSE();
    })();
</script>
</body>
</html>
